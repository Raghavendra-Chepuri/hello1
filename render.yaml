services:
  - type: web
    name: televault
    runtime: node
    plan: free
    buildCommand: cd server && npm install --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
